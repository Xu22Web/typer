name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # 应用是 Windows 专属（依赖 Win32 SendInput），CI 也跑在 Windows 上，
    # 这样系统测试那一层（真实调用 powershell.exe 宿主）才有意义。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: System tests
        # 默认层：校验宿主脚本语法/编码，并以 -DryRun 真实启动宿主（不产生真实按键）。
        # 真实注入层先探测能否送达：送到就照常断言（托管 runner 上大多数时候能送进去），
        # 一个字符都到不了说明这次会话没有可用的输入桌面，用例自行跳过而不是假红。
        run: pnpm test:system

      - name: Build
        run: pnpm build
