name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # 应用是 Windows 专属（依赖 Win32 SendInput），CI 也跑在 Windows 上，
    # 这样系统测试那一层（真实调用 powershell.exe 宿主）才有意义。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: System tests
        # 默认层：校验宿主脚本语法/编码，并以 -DryRun 真实启动宿主（不产生真实按键）。
        # 真实注入层只有在“完整到达”时才算通过：只到一部分（含 0 个字符，但字符内容对得上）
        # 视为环境限制（会话没有输入桌面 / 打字途中焦点被抢），用例自行跳过；内容对不上则报错。
        run: pnpm test:system

      - name: Build
        run: pnpm build
