name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # 应用是 Windows 专属（依赖 Win32 SendInput），CI 也跑在 Windows 上，
    # 这样系统测试那一层（真实调用 powershell.exe 宿主）才有意义。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: System tests
        # 默认层：校验宿主脚本语法/编码，并以 -DryRun 真实启动宿主（不产生真实按键）。
        # 真实注入层在托管 runner 上会自动跳过：那里拿得到前台窗口，但注入的按键到不了
        # 目标窗口（没有可用的交互式输入桌面），只会得到一条假红；需要时设 TYPIST_E2E_CI=1 强制开启。
        run: pnpm test:system

      - name: Build
        run: pnpm build
