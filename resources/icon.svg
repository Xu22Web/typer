<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Typer">
  <title>Typer</title>
  <desc>灰色屏幕面板在上、彩色键盘磁贴向左下错位前压：键盘为两排白色按键 + 空格条，对应"把文字逐个打进任意窗口"</desc>

  <defs>
    <clipPath id="panelClip"><rect x="120" y="61" width="328" height="258" rx="21"/></clipPath>
    
    <linearGradient id="tile" x1="0.06" y1="0" x2="0.94" y2="1">
      <stop offset="0" stop-color="#2fd0b4"/>
      <stop offset="0.45" stop-color="#16bcc9"/>
      <stop offset="1" stop-color="#226ce4"/>
    </linearGradient>
    <linearGradient id="tileLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileShade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b2f6b" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#0b2f6b" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#0b2f6b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileRim" x1="0.1" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#b0b9c4"/>
      <stop offset="0.55" stop-color="#8f99a6"/>
      <stop offset="1" stop-color="#78828f"/>
    </linearGradient>
    <linearGradient id="bodyLip" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c8d0d9"/>
      <stop offset="1" stop-color="#9ea8b4"/>
    </linearGradient>
    <linearGradient id="bodyRim" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="keyWhite" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#e8f1f8"/>
    </linearGradient>
    <filter id="bodyShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#0b1a2b" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b1a2b" flood-opacity="0.14"/>
    </filter>
    <filter id="tileShadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#04203a" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#04203a" flood-opacity="0.16"/>
    </filter>
    <filter id="keyShadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0a2a48" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g transform="translate(256 256) scale(1.1) translate(-256 -256)">
    <g filter="url(#bodyShadow)">
      <rect x="120" y="61" width="328" height="258" rx="21" fill="url(#body)"/>
      <g clip-path="url(#panelClip)"><rect x="120" y="293.2" width="328" height="25.8" fill="url(#bodyLip)"/></g>
      <rect x="121.5" y="62.5" width="325" height="255" rx="19.5" fill="none" stroke="url(#bodyRim)" stroke-width="2.5"/>
    </g>
    <g filter="url(#tileShadow)">
      <rect x="65" y="263" width="258" height="188" rx="18" fill="url(#tile)"/>
      <rect x="65" y="263" width="258" height="188" rx="18" fill="url(#tileLight)"/>
      <rect x="65" y="263" width="258" height="188" rx="18" fill="url(#tileShade)"/>
      <rect x="66.5" y="264.5" width="255" height="185" rx="16.5" fill="none" stroke="url(#tileRim)" stroke-width="2.5"/>
    </g>
    <g filter="url(#keyShadow)"><circle cx="123.5" cy="308.45" r="12.7" fill="#e3edf6"/><circle cx="123.5" cy="308" r="11.75" fill="url(#keyWhite)"/><circle cx="170.5" cy="308.45" r="12.7" fill="#e3edf6"/><circle cx="170.5" cy="308" r="11.75" fill="url(#keyWhite)"/><circle cx="217.5" cy="308.45" r="12.7" fill="#e3edf6"/><circle cx="217.5" cy="308" r="11.75" fill="url(#keyWhite)"/><circle cx="264.5" cy="308.45" r="12.7" fill="#e3edf6"/><circle cx="264.5" cy="308" r="11.75" fill="url(#keyWhite)"/><circle cx="147" cy="355.45" r="12.7" fill="#e3edf6"/><circle cx="147" cy="355" r="11.75" fill="url(#keyWhite)"/><circle cx="194" cy="355.45" r="12.7" fill="#e3edf6"/><circle cx="194" cy="355" r="11.75" fill="url(#keyWhite)"/><circle cx="241" cy="355.45" r="12.7" fill="#e3edf6"/><circle cx="241" cy="355" r="11.75" fill="url(#keyWhite)"/><rect x="112" y="389.5" width="164" height="25" rx="12.5" fill="#e3edf6"/><rect x="112" y="388.9" width="164" height="23.4" rx="11.7" fill="url(#keyWhite)"/></g>
  </g>
</svg>
