<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Typer">
  <title>Typer</title>
  <desc>键盘敲击：无底色键盘主体，键位由青绿过渡到蓝，其中一颗键正被按下</desc>
  <defs>
    <!-- 键盘面：左上受光，右下自然收暗，做出实体按键的弧面感 -->
    <linearGradient id="face" x1="0.08" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.6" stop-color="#f3f8fd" />
      <stop offset="1" stop-color="#dbe7f2" />
    </linearGradient>
    <!-- 底座侧面：给键盘一点厚度 -->
    <linearGradient id="base" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#c6d5e4" />
      <stop offset="1" stop-color="#a8bccf" />
    </linearGradient>
    <!-- 轮廓光：透明背景下靠它把白色主体从浅色桌面里拉出来 -->
    <linearGradient id="rim" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.45" stop-color="#aec0d1" stop-opacity="0.5" />
      <stop offset="1" stop-color="#8fa5ba" stop-opacity="0.42" />
    </linearGradient>
    <!-- 键位配色：同一族色相里从青绿走到蓝，多色但不花 -->
    <linearGradient id="keyMint" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6fecbb" />
      <stop offset="1" stop-color="#17bdb4" />
    </linearGradient>
    <linearGradient id="keyCyan" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#52dcdf" />
      <stop offset="1" stop-color="#1fa6d2" />
    </linearGradient>
    <linearGradient id="keyPressed" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2c6fe0" />
      <stop offset="1" stop-color="#1c4ec0" />
    </linearGradient>
    <linearGradient id="keySpace" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#63e5c2" />
      <stop offset="1" stop-color="#26b4cd" />
    </linearGradient>
    <!-- 键帽顶部高光 -->
    <linearGradient id="capTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="bodyShadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a2743" flood-opacity="0.28" />
    </filter>
    <filter id="keyShadow" x="-45%" y="-45%" width="200%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0a2743" flood-opacity="0.2" />
    </filter>
    <filter id="pressedShadow" x="-45%" y="-45%" width="200%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0a2743" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 键盘：底座 + 面 + 键位。键位刻意做大做少——同一份图形要兼顾 16px 任务栏与 256px 展示。 -->
  <g filter="url(#bodyShadow)">
    <rect x="48" y="152" width="416" height="218" rx="60" fill="url(#base)" />
    <rect x="48" y="144" width="416" height="212" rx="58" fill="url(#face)" />
    <rect
      x="48"
      y="144"
      width="416"
      height="212"
      rx="58"
      fill="none"
      stroke="url(#rim)"
      stroke-width="2.5"
    />
  </g>

  <!-- 第一行：三颗大键，中间一颗按下 -->
  <g filter="url(#keyShadow)">
    <rect x="104" y="188" width="90" height="64" rx="22" fill="url(#keyMint)" />
    <rect x="316" y="188" width="90" height="64" rx="22" fill="url(#keyCyan)" />
  </g>
  <rect x="202" y="186" width="106" height="72" rx="24" fill="#c3d4e5" />
  <g filter="url(#pressedShadow)">
    <rect x="207" y="196" width="96" height="56" rx="20" fill="url(#keyPressed)" />
  </g>
  <rect x="104" y="188" width="90" height="26" rx="22" fill="url(#capTop)" />
  <rect x="316" y="188" width="90" height="26" rx="22" fill="url(#capTop)" />
  <rect x="207" y="196" width="96" height="20" rx="20" fill="#ffffff" fill-opacity="0.16" />

  <!-- 空格键 -->
  <g filter="url(#keyShadow)">
    <rect x="146" y="276" width="220" height="46" rx="23" fill="url(#keySpace)" />
    <rect x="146" y="276" width="220" height="20" rx="23" fill="url(#capTop)" />
  </g>
</svg>